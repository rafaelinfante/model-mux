<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <div class="flex items-center gap-3">
        <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-indigo-600 font-bold text-white">
          mx
        </span>
        <div>
          <h1 class="text-lg font-semibold tracking-tight text-slate-900">model-mux</h1>
          <p class="text-xs text-slate-500">LLM gateway playground</p>
        </div>
      </div>
      <a
        href="/api/usage?hours=24"
        target="_blank"
        rel="noopener"
        class="hidden text-sm font-medium text-indigo-600 hover:text-indigo-700 sm:inline"
      >
        API &rarr;
      </a>
    </div>

    <nav class="mx-auto max-w-6xl px-6">
      <div class="flex gap-1 overflow-x-auto">
        @for (tab of tabs; track tab.id) {
          <button
            type="button"
            (click)="active.set(tab.id)"
            [class]="
              active() === tab.id
                ? 'border-b-2 border-indigo-600 px-4 py-3 text-sm font-semibold text-indigo-600'
                : 'border-b-2 border-transparent px-4 py-3 text-sm font-medium text-slate-500 hover:text-slate-800'
            "
          >
            {{ tab.label }}
          </button>
        }
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-6xl px-6 py-8">
    @switch (active()) {
      @case ('chat') {
        <app-chat-playground />
      }
      @case ('compare') {
        <app-compare-panel />
      }
      @case ('usage') {
        <app-usage-dashboard />
      }
      @case ('skills') {
        <app-dev-skills />
      }
    }
  </main>
</div>
